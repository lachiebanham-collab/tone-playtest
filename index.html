<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tone Playtest</title>
<meta name="description" content="Help test Tone, a colour combination app inspired by Sanzo Wada.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='14' rx='5' fill='%23f9c1ce'/%3E%3Crect y='9' width='32' height='14' rx='5' fill='%23fdd4bd'/%3E%3Crect y='18' width='32' height='14' rx='5' fill='%2378cdd0'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --text: #1C1C1E;
    --secondary: #6E6E73;
    --tertiary: #AEAEB2;
    --fill: #E9E9EE;
    --fill-strong: #DCDCE1;
    --hairline: rgba(60, 60, 67, 0.18);
    --accent: #FF2D55;
    --accent-text: #FFFFFF;
    --accent-soft: rgba(255, 45, 85, 0.12);
    --warn-bg: #FFF4D6;
    --warn-text: #6B4E00;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113;
      --card: #1C1C1E;
      --text: #F2F2F7;
      --secondary: #98989F;
      --tertiary: #636366;
      --fill: #2C2C2E;
      --fill-strong: #3A3A3C;
      --hairline: rgba(235, 235, 245, 0.16);
      --accent: #FF375F;
      --accent-soft: rgba(255, 55, 95, 0.18);
      --warn-bg: #3A2F12;
      --warn-text: #F3D58A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111113;
    --card: #1C1C1E;
    --text: #F2F2F7;
    --secondary: #98989F;
    --tertiary: #636366;
    --fill: #2C2C2E;
    --fill-strong: #3A3A3C;
    --hairline: rgba(235, 235, 245, 0.16);
    --accent: #FF375F;
    --accent-soft: rgba(255, 55, 95, 0.18);
    --warn-bg: #3A2F12;
    --warn-text: #F3D58A;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.35;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }

  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }

  /* Top bar */
  /* Equal-width side columns keep the bar centred; the counter sits in the right one. */
  .topbar { display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; gap: 12px; padding: 8px 0 16px; }
  .topbar::before { content: ""; }
  .progress { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width 0.35s ease; }

  .notice {
    background: var(--warn-bg); color: var(--warn-text);
    border-radius: 16px; padding: 12px 16px; font-size: 15px; margin-bottom: 12px;
  }

  /* Card */
  .card {
    background: var(--card);
    border-radius: 32px;
    padding: 20px;
    animation: rise 0.28s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } .progress > div { transition: none; } }


  h1 { font-size: 26px; line-height: 1.23; font-weight: 400; letter-spacing: -0.015em; margin: 0; }
  h2 { font-size: 17px; font-weight: 500; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { margin: 12px 0 0; }
  .muted { color: var(--secondary); font-size: 16px; }
  .small { font-size: 13px; color: var(--secondary); }
  ul.tidy { margin: 12px 0 0; padding-left: 20px; color: var(--secondary); font-size: 16px; }
  ul.tidy li + li { margin-top: 6px; }

  .field { margin-top: 40px; }
  .field label.q, .field .q { display: block; font-size: 17px; font-weight: 500; margin-bottom: 10px; }
  .optional { font-weight: 400; color: var(--tertiary); font-size: 15px; white-space: nowrap; }
  input[type="text"], textarea {
    width: 100%; border: none; outline: none;
    background: var(--fill); border-radius: 14px;
    padding: 13px 14px; font-size: 17px;
    transition: box-shadow 0.15s ease;
  }
  textarea { min-height: 84px; resize: vertical; line-height: 1.35; }
  input[type="text"]:focus, textarea:focus { box-shadow: 0 0 0 2px var(--accent); }
  ::placeholder { color: var(--tertiary); }

  /* Ease scale */
  /* --p (0-1) drives the filled part of the track; the thumb is 28px wide. */
  .slider {
    --p: 0;
    --track-fill: var(--tertiary);
    -webkit-appearance: none; appearance: none;
    display: block; width: 100%; height: 32px; margin: 4px 0 0; padding: 0;
    background: transparent; cursor: pointer; touch-action: pan-y;
    -webkit-tap-highlight-color: transparent;
  }
  .slider:focus { outline: none; }
  .slider::-webkit-slider-runnable-track {
    height: 10px; border-radius: 5px;
    background: linear-gradient(var(--track-fill), var(--track-fill)) 0 0 / calc(14px + var(--p) * (100% - 28px)) 100% no-repeat, var(--fill);
  }
  .slider::-moz-range-track {
    height: 10px; border-radius: 5px;
    background: linear-gradient(var(--track-fill), var(--track-fill)) 0 0 / calc(14px + var(--p) * (100% - 28px)) 100% no-repeat, var(--fill);
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 28px; height: 28px; margin-top: -9px; border: none; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
    transition: transform 0.12s ease, opacity 0.15s ease;
  }
  .slider::-moz-range-thumb {
    width: 28px; height: 28px; border: none; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.22), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
  }
  .slider:active::-webkit-slider-thumb { transform: scale(1.1); }
  .slider:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent-soft), 0 1px 4px rgba(0, 0, 0, 0.22); }

  .ticks { position: relative; height: 22px; margin: 6px 14px 0; }
  .ticks button {
    position: absolute; top: 0; transform: translateX(-50%);
    border: none; background: none; padding: 0 6px; cursor: pointer;
    font-size: 14px; color: var(--secondary); font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent;
  }
  .ticks button.on { color: var(--text); font-weight: 600; }
  .rating.touched .slider { --track-fill: var(--accent); }
  .rating.touched .ticks button.on { color: var(--accent); }
  .scale-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--secondary); margin-top: 2px; }
  .q-row { display: flex !important; justify-content: space-between; align-items: baseline; gap: 12px; }
  .scale-readout { font-size: 15px; color: var(--secondary); font-weight: 500; white-space: nowrap; }
  .rating.touched .scale-readout { color: var(--accent); }

  /* Choice pills */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    border: none; border-radius: 999px; background: var(--fill);
    padding: 10px 16px; font-size: 16px; cursor: pointer;
    transition: background 0.15s ease; -webkit-tap-highlight-color: transparent;
  }
  .pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .other-input { margin-top: 10px; }

  /* In-card navigation: back arrow top-left, main button at the bottom */
  /* Back arrow left, task counter centred; the empty right column mirrors the arrow. */
  .card-top { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; margin: -4px -4px 48px; }
  .stepcount { text-align: center; font-size: 15px; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .back-btn {
    flex: none; width: 40px; height: 40px; border: none; border-radius: 50%;
    background: var(--fill); color: var(--text); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.12s ease, background 0.15s ease; -webkit-tap-highlight-color: transparent;
  }
  .back-btn:active { transform: scale(0.94); background: var(--fill-strong); }
  .back-btn svg { width: 18px; height: 18px; }
  .card-footer { margin-top: 48px; }
  .card-footer .btn-primary { width: 100%; }
  .btn {
    border: none; border-radius: 999px; padding: 15px 22px; font-size: 17px; cursor: pointer;
    transition: opacity 0.15s ease, transform 0.12s ease; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { flex: 1; background: var(--accent); color: var(--accent-text); font-weight: 500; }
  .btn-primary:disabled { opacity: 0.35; cursor: default; transform: none; }
  .btn-secondary { background: var(--fill-strong); }
  .btn-block { width: 100%; margin-top: 12px; }
  .card-cta { margin-top: 48px; }

  .status { margin-top: 16px; font-size: 15px; color: var(--secondary); }
  .status.error { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <div class="progress" aria-hidden="true"><div id="progressFill"></div></div>
  </div>
  <div class="notice" id="notConnected" hidden>
    Heads up: answers aren't connected to a sheet yet. You can still fill it in and copy your answers at the end.
  </div>
  <div id="screen"></div>
</main>

<!-- Bump ?v= whenever shared.js changes, so browsers never pair a new page with a cached old copy. -->
<script src="shared.js?v=ade0ac87"></script>
<script>
const STORAGE_KEY = "tone-playtest-v1";

const DESIGN_OPTIONS = ["Nope", "For fun", "For work"];
const KEEP_OPTIONS = ["Yep", "Maybe", "Nah"];
const USE_OPTIONS = ["Home & interiors", "Outfits", "Design work", "Art", "Events & weddings", "Just for fun", "Something else"];

// Screen order: intro, about, 11 tasks, overall, thanks.
const STEPS = ["intro", "about", ...TASKS.map((_, i) => "task" + i), "overall", "thanks"];
const LAST_INPUT_STEP = STEPS.indexOf("overall");

const DEFAULT_SCORE = 3;

function blankAnswers() {
  return {
    name: "", iphone: "", design: "",
    tasks: TASKS.map(() => ({ score: DEFAULT_SCORE, touched: false, note: "" })),
    keep: "", loved: "", bugged: "", useFor: [], useForOther: "", oneMore: ""
  };
}

let state = { step: 0, answers: blankAnswers(), submitted: false, sendFailed: false };

// ── Draft persistence (per-device convenience only) ──────────
function loadDraft() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    const base = blankAnswers();
    const answers = Object.assign(base, saved.answers || {});
    answers.tasks = base.tasks.map((t, i) => Object.assign(t, (saved.answers && saved.answers.tasks && saved.answers.tasks[i]) || {}));
    state.answers = answers;
    state.step = Math.min(Math.max(0, saved.step | 0), LAST_INPUT_STEP);
  } catch (e) { /* storage unavailable or corrupt — start fresh */ }
}
function saveDraft() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ step: state.step, answers: state.answers })); } catch (e) {}
}
function clearDraft() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
}

// ── Rendering helpers ────────────────────────────────────────
const $ = (sel) => document.querySelector(sel);
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v === true) node.setAttribute(k, "");
    else if (v !== false && v != null) node.setAttribute(k, v);
  }
  for (const child of children.flat()) {
    if (child == null || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(child));
  }
  return node;
}

function textInput(key, placeholder, multiline) {
  const attrs = { placeholder, id: "f-" + key, oninput: (e) => { state.answers[key] = e.target.value; saveDraft(); updateActions(); } };
  const node = multiline ? el("textarea", attrs) : el("input", Object.assign({ type: "text", autocomplete: "off" }, attrs));
  node.value = state.answers[key];
  return node;
}

function pillGroup(options, isOn, onTap, label) {
  return el("div", { class: "pills", role: "group", "aria-label": label },
    options.map((opt) => el("button", {
      class: "pill", type: "button", "aria-pressed": String(isOn(opt)),
      onclick: () => { onTap(opt); saveDraft(); render(false); }
    }, opt)));
}

// ── Screens ──────────────────────────────────────────────────
function introScreen() {
  return el("section", { class: "card" },
    el("h1", {}, "Hey! Thanks for helping test Tone."),
    el("p", { class: "muted" }, "Tone is a pocket version of Sanzo Wada's A Dictionary of Colour Combinations — swipe through classic colour pairings, save the ones you love, and make palettes of your own."),
    el("p", { class: "muted" }, "You'll get 11 little tasks. Try each one in the app, then come back here and say how easy it was. Takes about 20–30 minutes."),
    el("ul", { class: "tidy" },
      el("li", {}, "We're testing the app, not you — there are no wrong answers."),
      el("li", {}, "If you get stuck, it's totally fine to give up. That's the most useful feedback of all."),
      el("li", {}, "Start from a fresh install so you see the welcome screens."),
      el("li", {}, "Your progress saves as you go, so you can flick between Tone and this page.")
    ),
    el("button", { class: "btn btn-primary btn-block card-cta", type: "button", onclick: () => go(1) }, "Let's go")
  );
}

function aboutScreen() {
  const a = state.answers;
  return el("section", { class: "card" },
    el("h1", {}, "A bit about you"),
    el("div", { class: "field" },
      el("label", { class: "q", for: "f-name" }, "Your name"),
      textInput("name", "So I know who said what")),
    el("div", { class: "field" },
      el("label", { class: "q q-row", for: "f-iphone" }, "Which iPhone?", el("span", { class: "optional" }, "optional")),
      textInput("iphone", "e.g. iPhone 15 Pro")),
    el("div", { class: "field" },
      el("span", { class: "q" }, "Do you do anything design-y?"),
      pillGroup(DESIGN_OPTIONS, (o) => a.design === o, (o) => { a.design = a.design === o ? "" : o; }, "Design background"))
  );
}

function taskScreen(i) {
  const task = state.answers.tasks[i];
  // Drafts saved under the old 0-5 scale or before the default existed
  if (task.score == null || task.score < EASE_MIN || task.score > EASE_MAX) task.score = DEFAULT_SCORE;
  const readout = el("div", { class: "scale-readout", "aria-live": "polite" });
  const slider = el("input", {
    type: "range", class: "slider", min: String(EASE_MIN), max: String(EASE_MAX), step: "1",
    "aria-label": `How easy was that, from ${EASE_MIN} (couldn't do it) to ${EASE_MAX} (super easy)`
  });
  const steps = EASE_MAX - EASE_MIN;
  const ticks = el("div", { class: "ticks" },
    Array.from({ length: steps + 1 }, (_, k) => EASE_MIN + k).map((n) => el("button", {
      type: "button", tabindex: "-1", "aria-hidden": "true", style: `left:${((n - EASE_MIN) / steps) * 100}%`,
      onclick: () => { touch(); setScore(n); }
    }, String(n))));
  const rating = el("div", { class: "field rating" });

  // Updated in place (not re-rendered) so a drag isn't interrupted.
  function paint() {
    const n = task.score;
    slider.value = n;
    slider.style.setProperty("--p", (n - EASE_MIN) / steps);
    slider.setAttribute("aria-valuetext", `${n} — ${EASE_LABELS[n]}`);
    ticks.querySelectorAll("button").forEach((b, k) => b.classList.toggle("on", k + EASE_MIN === n));
    readout.textContent = `${n} · ${EASE_LABELS[n]}`;
    rating.classList.toggle("touched", Boolean(task.touched));
  }
  // Grey until the tester engages with it, then the accent colour.
  function touch() {
    if (task.touched) return;
    task.touched = true;
    saveDraft();
    paint();
    updateActions();
  }
  function setScore(n) {
    if (task.score === n) return;
    task.score = n;
    saveDraft();
    paint();
    updateActions();
  }
  slider.addEventListener("pointerdown", touch);
  slider.addEventListener("keydown", touch);
  slider.addEventListener("input", () => { touch(); setScore(Number(slider.value)); });
  rating.append(
    el("div", { class: "q q-row" }, el("span", {}, "How easy was that?"), readout),
    slider,
    ticks,
    el("div", { class: "scale-ends", "aria-hidden": "true" }, el("span", {}, "Couldn't do it"), el("span", {}, "Super easy")));
  paint();

  const note = el("input", {
    type: "text", id: "f-note", autocomplete: "off",
    placeholder: i === 0 ? "e.g. where did you look first?" : "Where did you look? What surprised you?",
    oninput: (e) => { task.note = e.target.value; saveDraft(); }
  });
  note.value = task.note;

  return el("section", { class: "card" },
    el("h1", {}, TASKS[i].text),
    rating,
    el("div", { class: "field" },
      el("label", { class: "q q-row", for: "f-note" }, "Anything to add?", el("span", { class: "optional" }, "optional")),
      note)
  );
}

function overallScreen() {
  const a = state.answers;
  const otherOn = a.useFor.includes("Something else");
  return el("section", { class: "card" },
    el("h1", {}, "Overall thoughts"),
    el("div", { class: "field" },
      el("span", { class: "q" }, "Would you keep Tone on your phone?"),
      pillGroup(KEEP_OPTIONS, (o) => a.keep === o, (o) => { a.keep = a.keep === o ? "" : o; }, "Would you keep Tone")),
    el("div", { class: "field" },
      el("label", { class: "q q-row", for: "f-loved" }, "What did you love?", el("span", { class: "optional" }, "optional")),
      textInput("loved", "Features, feel, anything", true)),
    el("div", { class: "field" },
      el("label", { class: "q q-row", for: "f-bugged" }, "What bugged you?", el("span", { class: "optional" }, "optional")),
      textInput("bugged", "Confusing bits, bugs, annoyances", true)),
    el("div", { class: "field" },
      el("span", { class: "q q-row" }, "What would you use it for?", el("span", { class: "optional" }, "pick any")),
      pillGroup(USE_OPTIONS, (o) => a.useFor.includes(o), (o) => {
        a.useFor = a.useFor.includes(o) ? a.useFor.filter((x) => x !== o) : [...a.useFor, o];
      }, "What would you use Tone for"),
      otherOn ? el("div", { class: "other-input" }, textInput("useForOther", "Tell us more")) : null),
    el("div", { class: "field" },
      el("label", { class: "q q-row", for: "f-oneMore" }, "If Tone could do one more thing for you, what would it be?", el("span", { class: "optional" }, "optional")),
      textInput("oneMore", "Dream big", true)),
    el("div", { class: "status error", id: "sendError", hidden: !state.sendFailed },
      "Couldn't send just now — check your connection and try again, or copy your answers on the next screen.")
  );
}

function thanksScreen() {
  const sent = Boolean(SCRIPT_URL) && !state.sendFailed;
  if (sent) {
    return el("section", { class: "card" },
      el("h1", {}, "Thank you! Your answers are in."),
      el("p", { class: "muted" }, "I really appreciate it. If you think of anything else later, just send me a message."));
  }
  // Fallback only when the answers didn't reach the sheet: share or copy them instead.
  const status = el("p", { class: "status", id: "copyStatus", "aria-live": "polite" });
  const canShare = typeof navigator.share === "function";
  return el("section", { class: "card" },
    el("h1", {}, "Thank you! One last step."),
    el("p", { class: "muted" }, "Your answers couldn't be sent automatically. Tap below and send them to me in a message."),
    canShare ? el("button", { class: "btn btn-primary btn-block card-cta", type: "button", onclick: () => shareAnswers(status) }, "Send my answers") : null,
    el("button", { class: `btn btn-secondary btn-block${canShare ? "" : " card-cta"}`, type: "button", onclick: () => copyAnswers(status) }, "Copy my answers"),
    status
  );
}

// ── Navigation ───────────────────────────────────────────────
function canAdvance() {
  const key = STEPS[state.step];
  const a = state.answers;
  if (key === "about") return a.name.trim().length > 0;
  if (key.startsWith("task")) return a.tasks[+key.slice(4)].touched === true;
  if (key === "overall") return a.keep !== "";
  return true;
}

function updateActions() {
  const next = $("#nextBtn");
  if (!next) return;
  next.disabled = !canAdvance();
}

const BACK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

// Steps between the intro and thanks get a back arrow top-left and the main button inside the card.
function addCardNav(screen, key) {
  const back = el("button", { class: "back-btn", type: "button", "aria-label": "Back", onclick: () => go(-1) });
  back.innerHTML = BACK_ICON;
  screen.prepend(el("div", { class: "card-top" }, back,
    key.startsWith("task") ? el("span", { class: "stepcount" }, `${+key.slice(4) + 1}/${TASKS.length}`) : null));

  screen.append(el("div", { class: "card-footer" },
    el("button", {
      class: "btn btn-primary", id: "nextBtn", type: "button",
      onclick: () => {
        if (!canAdvance()) return;
        if (key === "overall") submit();
        else go(1);
      }
    }, key === "overall" ? "Send answers" : "Next")));
}

function render(scrollTop = true) {
  try {
    renderStep(scrollTop);
  } catch (err) {
    // Never leave a blank page: offer a reload (keeps progress) or a fresh start.
    console.error(err);
    $("#screen").replaceChildren(el("section", { class: "card" },
      el("h1", {}, "Something went wrong"),
      el("p", { class: "muted" }, "Try reloading the page. Your answers so far are saved."),
      el("button", { class: "btn btn-primary btn-block card-cta", type: "button", onclick: () => location.reload() }, "Reload"),
      el("button", { class: "btn btn-secondary btn-block", type: "button", onclick: () => { clearDraft(); location.reload(); } }, "Start over")));
  }
}

function renderStep(scrollTop) {
  const key = STEPS[state.step];
  let screen;
  if (key === "intro") screen = introScreen();
  else if (key === "about") screen = aboutScreen();
  else if (key.startsWith("task")) screen = taskScreen(+key.slice(4));
  else if (key === "overall") screen = overallScreen();
  else screen = thanksScreen();

  if (key !== "intro" && key !== "thanks") addCardNav(screen, key);

  // Re-rendering in place (a tap on a pill/scale) shouldn't replay the entrance animation.
  if (!scrollTop) screen.style.animation = "none";
  $("#screen").replaceChildren(screen);

  const pct = Math.round((Math.min(state.step, LAST_INPUT_STEP) / LAST_INPUT_STEP) * 100);
  $("#progressFill").style.width = (key === "thanks" ? 100 : pct) + "%";
  $("#notConnected").hidden = Boolean(SCRIPT_URL) || key === "thanks";
  updateActions();
  if (scrollTop) window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function go(delta) {
  state.step = Math.min(Math.max(0, state.step + delta), STEPS.length - 1);
  if (STEPS[state.step] !== "thanks") saveDraft();
  render();
}

// ── Submission ───────────────────────────────────────────────
function payload() {
  const a = state.answers;
  const flat = {
    submittedAt: new Date().toISOString(),
    name: a.name.trim(),
    iphone: a.iphone.trim(),
    design: a.design,
    keep: a.keep,
    loved: a.loved.trim(),
    bugged: a.bugged.trim(),
    useFor: a.useFor.filter((x) => x !== "Something else").concat(a.useForOther.trim() && a.useFor.includes("Something else") ? ["Other: " + a.useForOther.trim()] : []).join(", "),
    oneMore: a.oneMore.trim(),
    userAgent: navigator.userAgent
  };
  a.tasks.forEach((t, i) => {
    flat[`t${i + 1}Score`] = t.score;
    flat[`t${i + 1}Note`] = t.note.trim();
  });
  return flat;
}

function readableAnswers() {
  const p = payload();
  const lines = [`Tone playtest — ${p.name || "Anonymous"}`];
  if (p.iphone) lines.push(`iPhone: ${p.iphone}`);
  if (p.design) lines.push(`Design-y: ${p.design}`);
  lines.push("");
  TASKS.forEach((t, i) => {
    const score = p[`t${i + 1}Score`];
    const note = p[`t${i + 1}Note`];
    lines.push(`${i + 1}. ${t.short}: ${score}/5 (${EASE_LABELS[score]})${note ? " — " + note : ""}`);
  });
  lines.push("", `Keep it: ${p.keep}`);
  if (p.loved) lines.push(`Loved: ${p.loved}`);
  if (p.bugged) lines.push(`Bugged me: ${p.bugged}`);
  if (p.useFor) lines.push(`Would use it for: ${p.useFor}`);
  if (p.oneMore) lines.push(`One more thing: ${p.oneMore}`);
  return lines.join("\n");
}

async function submit() {
  const next = $("#nextBtn");
  if (!SCRIPT_URL) { finish(false); return; }
  next.disabled = true;
  next.textContent = "Sending…";
  try {
    // text/plain avoids a CORS preflight that Apps Script can't answer; the response is opaque.
    await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload()) });
    finish(true);
  } catch (e) {
    state.sendFailed = true;
    render(false);
  }
}

function finish(sent) {
  state.sendFailed = !sent;
  state.submitted = true;
  // Keep the answers in memory for copy/share; only drop the stored draft once they're safely sent.
  if (sent) clearDraft();
  state.step = STEPS.indexOf("thanks");
  render();
}

async function copyAnswers(status) {
  const text = readableAnswers();
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = el("textarea", { style: "position:fixed;opacity:0" });
    ta.value = text;
    document.body.append(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (err) {}
    ta.remove();
  }
  status.textContent = "Copied! Paste it into a message to me.";
}

async function shareAnswers(status) {
  try {
    await navigator.share({ title: "My Tone playtest answers", text: readableAnswers() });
  } catch (e) {
    if (e && e.name !== "AbortError") status.textContent = "Sharing didn't work — try Copy instead.";
  }
}

loadDraft();
render();
</script>
</body>
</html>
